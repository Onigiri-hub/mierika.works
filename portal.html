<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>こもれび教室のアプリたち</title>
<link rel="icon" href="imgs/pochi.png">
<!-- タイトル用の丸ゴシック。text= でタイトルに使う文字だけ読み込む（文字を変えたらここも直す） -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@700&text=Pochi%E3%81%A8%E3%81%9D%E3%81%AE%E4%BB%B2%E9%96%93%E3%81%9F%E3%81%A1%E3%81%AE%E3%81%93%E3%82%82%E3%82%8C%E3%81%B3%E6%95%99%E5%AE%A4&display=swap">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #ebebeb;
    color: #333333;
    font-family: 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 48px 24px 64px;
  }

  h1 {
    font-size: 1.4rem;
    font-weight: bold;
    letter-spacing: 0.05em;
    margin-bottom: 40px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  /* ヒーロー：森をキャラクターたちが歩き回る（動きは js/forest.js） */
  .hero {
    width: 100%;
    max-width: 360px;
    margin-bottom: 32px;
  }

  /* タイトル：森の空に少し重ねる */
  .hero-title {
    display: block; /* 上の h1 の横並び（flex）を打ち消す */
    position: relative;
    z-index: 1;
    margin-bottom: -3rem;
    font-family: 'Zen Maru Gothic', 'Hiragino Maru Gothic ProN', sans-serif;
    font-weight: 700;
    text-align: center;
    line-height: 1.3;
    letter-spacing: 0.06em;
  }

  .hero-title small {
    display: block;
    font-size: 0.95rem;
  }

  .hero-title span {
    display: block;
    font-size: 2rem;
  }

  @media (min-width: 768px) {
    .hero-title { margin-bottom: -4.5rem; }
    .hero-title small { font-size: 1.2rem; }
    .hero-title span { font-size: 2.8rem; }
  }

  .forest {
    position: relative;
    isolation: isolate; /* キャラの重なり順をこの中だけで決めて、タイトルより下にする */
    width: 100%;
    aspect-ratio: 4 / 3;
    overflow: hidden;
    border-radius: 18px;
    background: linear-gradient(to bottom, #ebebeb 0 60%, #d3e0b8 60%);
  }

  @media (min-width: 768px) {
    .hero { max-width: 744px; }
    .forest { aspect-ratio: 1000 / 420; }
  }

  .sprite {
    position: absolute;
    left: 0;
    top: 0;
    width: 0;
    height: 0;
  }

  .pose {
    position: absolute;
    bottom: 0;
    transform-origin: 50% 100%;
  }

  .anim {
    position: relative;
    transform-origin: 50% 100%;
  }

  .anim .frame {
    display: block;
    width: 100%;
    height: auto;
    user-select: none;
    pointer-events: none;
  }

  .anim .book {
    position: absolute;
    left: 50%;
    bottom: 18%;
    width: 60%;
    transform: translateX(-50%);
  }

  /* 歩くときはカクカク跳ねる */
  .anim.is-walk { animation: hop 0.5s steps(1) infinite; }
  @keyframes hop {
    0% { transform: translateY(0); }
    50% { transform: translateY(-6%); }
  }

  /* ツンツンついばむ */
  .anim.is-peck { animation: peck 0.4s ease-in-out infinite; }
  @keyframes peck {
    0%, 100% { transform: rotate(0); }
    50% { transform: rotate(28deg); }
  }

  /* 本を読みながらゆらゆら */
  .anim.is-read { animation: sway 2.4s ease-in-out infinite; }
  @keyframes sway {
    0%, 100% { transform: rotate(-2deg); }
    50% { transform: rotate(2deg); }
  }

  @media (prefers-reduced-motion: reduce) {
    .anim { animation: none !important; }
  }

  .cards {
    display: flex;
    flex-direction: column;
    gap: 24px;
    width: 100%;
    max-width: 360px;
  }

  /* パソコンなど横に広い画面では2列（上段：Pochi英語・Pochi-Mine、下段：周期表パズル・Piyo理科） */
  @media (min-width: 768px) {
    .cards {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      max-width: 744px;
    }
  }

  .card {
    background-image: url('imgs/frame.png');
    background-size: 100% 100%;
    background-repeat: no-repeat;
    background-color: transparent;
    border: none;
    border-radius: 0;
    aspect-ratio: 500 / 271;
    padding: 28px 38px;
    text-decoration: none;
    color: #333333;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    position: relative;
  }


  .card.locked {
    opacity: 0.45;
    cursor: not-allowed;
    pointer-events: none;
  }

  .card-icon {
    font-size: 2.6rem;
  }

  .card-body {
    text-align: center;
  }

  .card-title {
    font-size: 1.15rem;
    font-weight: bold;
    text-align: center;
  }

  .card-desc {
    font-size: 0.82rem;
    color: #666;
    line-height: 1.5;
  }

  .lock-badge {
    position: absolute;
    top: 12px;
    right: 14px;
    font-size: 0.7rem;
    background: #999;
    color: #fff;
    border-radius: 20px;
    padding: 2px 10px;
    letter-spacing: 0.05em;
  }

  .lock-icon {
    font-size: 1.4rem;
    color: #999;
    flex-shrink: 0;
  }

  .copyright {
    margin-top: 24px;
    font-size: 0.72rem;
    color: #aaa;
    text-align: center;
  }

  .copyright a {
    color: #aaa;
    text-decoration: none;
  }
</style>
</head>
<body>

<!-- <h1>こもれび教室のアプリたち</h1> -->

<div class="hero">
  <h1 class="hero-title"><small>Pochiとその仲間たちの</small><span>こもれび教室</span></h1>
  <div class="forest" role="img" aria-label="森でポチやひよこ、カエル、ちょうちょが遊んでいるイラスト"></div>
</div>

<div class="cards">

  <!-- Pochi英語 -->
  <a class="card" href="https://pochi-english.vercel.app/" target="_blank" rel="noopener">
    <div class="card-icon"><img src="imgs/pochi.png" alt="Pochi" style="width:65px;height:auto;"></div>
    <div class="card-body">
      <div class="card-title">Pochi英語</div>
      <div style="font-size:0.7rem;color:#888;margin-top:2px;">（β版公開中）</div>
    </div>
  </a>

  <!-- Pochi-Mine -->
  <a class="card" href="https://pochi-mine.vercel.app/" target="_blank" rel="noopener">
    <div class="card-icon"><img src="imgs/pochi-mine.png" alt="Pochi-Mine" style="width:65px;height:auto;border-radius:14px;"></div>
    <div class="card-body">
      <div class="card-title">Pochi-Mine</div>
      <div style="font-size:0.7rem;color:#888;margin-top:2px;">（β版公開中）</div>
    </div>
  </a>

  <!-- 周期表パズル -->
  <a class="card" href="https://onigiri-hub.github.io/chem_periodic_table/" target="_blank" rel="noopener">
    <div class="card-icon"><img src="imgs/chem-puzzle-icon.png" alt="周期表パズル" style="width:65px;height:auto;"></div>
    <div class="card-body">
      <div class="card-title">周期表パズル</div>
    </div>
  </a>

  <!-- Piyo理科（ロック） -->
  <div class="card locked">
    <div class="card-body">
      <div class="card-title">Piyo理科</div>
    </div>
    <span class="lock-badge">🔒 がんばって制作中</span>
  </div>

</div>

<p class="copyright">&copy; 2026 <a href="index.html">ミエリカ・ワークス</a>. All rights reserved.</p>

<script src="js/forest.js"></script>

</body>
</html>
