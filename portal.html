<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>こもれび教室のアプリたち</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #ebebeb;
    color: #333333;
    font-family: 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 48px 24px 64px;
  }

  h1 {
    font-size: 1.4rem;
    font-weight: bold;
    letter-spacing: 0.05em;
    margin-bottom: 40px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .cards {
    display: flex;
    flex-direction: column;
    gap: 24px;
    width: 100%;
    max-width: 360px;
  }

  .card {
    background-image: url('imgs/frame.png');
    background-size: 100% 100%;
    background-repeat: no-repeat;
    background-color: transparent;
    border: none;
    border-radius: 0;
    aspect-ratio: 500 / 271;
    padding: 28px 38px;
    text-decoration: none;
    color: #333333;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    position: relative;
  }


  .card.locked {
    opacity: 0.45;
    cursor: not-allowed;
    pointer-events: none;
  }

  .card-icon {
    font-size: 2.6rem;
  }

  .card-body {
    text-align: center;
  }

  .card-title {
    font-size: 1.15rem;
    font-weight: bold;
    text-align: center;
  }

  .card-desc {
    font-size: 0.82rem;
    color: #666;
    line-height: 1.5;
  }

  .lock-badge {
    position: absolute;
    top: 12px;
    right: 14px;
    font-size: 0.7rem;
    background: #999;
    color: #fff;
    border-radius: 20px;
    padding: 2px 10px;
    letter-spacing: 0.05em;
  }

  .lock-icon {
    font-size: 1.4rem;
    color: #999;
    flex-shrink: 0;
  }

  footer {
    margin-top: 56px;
    font-size: 0.75rem;
    color: #999;
    text-align: center;
    line-height: 1.8;
  }
</style>
</head>
<body>

<!-- <h1>こもれび教室のアプリたち</h1> -->

<div class="cards">

  <!-- Pochi英語 -->
  <a class="card" href="https://pochi-english.vercel.app/" target="_blank" rel="noopener">
    <div class="card-icon"><img src="imgs/pochi.png" alt="Pochi" style="width:65px;height:auto;"></div>
    <div class="card-body">
      <div class="card-title">Pochi英語</div>
      <div style="font-size:0.7rem;color:#888;margin-top:2px;">（β版公開中）</div>
    </div>
  </a>

  <!-- 周期表パズル -->
  <a class="card" href="https://onigiri-hub.github.io/chem_periodic_table/" target="_blank" rel="noopener">
    <div class="card-icon"><img src="imgs/chem-puzzle-icon.png" alt="周期表パズル" style="width:65px;height:auto;"></div>
    <div class="card-body">
      <div class="card-title">周期表パズル</div>
    </div>
  </a>

  <!-- Piyo理科（ロック） -->
  <div class="card locked">
    <div class="card-body">
      <div class="card-title">Piyo理科</div>
    </div>
    <span class="lock-badge">🔒 がんばって制作中</span>
  </div>

</div>


</body>
</html>
